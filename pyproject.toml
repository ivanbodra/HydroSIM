[project]
name = "hydrosim"
version = "0.1.0"
description = "Scientific and didactic hydrographic surveying simulator"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff"
]
visualization = [
    "matplotlib",
    "plotly",
    "PySide6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# Start CI linting with correctness-critical rules that can be enabled without
# mixing this scientific checkpoint with a repository-wide style rewrite.
# The rule set can be expanded incrementally once the existing compact legacy
# formatting has been normalized deliberately.
[tool.ruff.lint]
select = ["E9", "F"]
