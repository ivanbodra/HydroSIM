[project]
name = "hydrosim"
version = "0.1.0"
description = "Scientific and didactic hydrographic surveying simulator"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff"
]
visualization = [
    "matplotlib",
    "plotly",
    "PySide6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# Start CI linting with correctness-critical rules that can be enabled without
# mixing this scientific checkpoint with a repository-wide import/style rewrite.
# In particular, the acquisition package intentionally re-exports its public API,
# so broad F401 enforcement requires a separate packaging/style decision.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
