id: hydrosim.integration.principal_plane_array_tilt_sensitivity_map
version: 0.1.0
scientific_status: analytical_diagnostic
language: en

purpose: >-
  Map the exact reduced-model zero-tilt sensitivity of the profile-frame Snell
  ray-parameter mismatch over configured principal-plane beam angle and transducer
  sound-speed sensor bias.

state_categories:
  inputs:
    - Truth
    - Configured
    - Observed
  outputs:
    - Derived

formulation:
  biased_sonar_value:
    equations:
      - "c_used = c_true + b"
  physical_array_angle:
    equations:
      - "theta_phys = asin((c_true / c_used) * sin(theta))"
  exact_tilt_mismatch:
    equations:
      - "Delta_p(tau) = K(theta, b) * sin(tau)"
  zero_tilt_sensitivity:
    equations:
      - "K(theta, b) = cos(theta) / c_used - cos(theta_phys) / c_true"
      - "K = d(Delta_p) / d(tau) at tau = 0"

variables:
  theta:
    description: configured principal-plane beam angle relative to the array normal
    unit: rad
  b:
    description: additive transducer sound-speed sensor bias
    unit: m/s
  c_true:
    description: true local sound speed at transducer depth
    unit: m/s
  c_used:
    description: sound speed used by the sonar
    unit: m/s
  theta_phys:
    description: physical TX angle in the array frame
    unit: rad
  tau:
    description: principal-plane array tilt relative to the horizontal-profile vertical
    unit: rad
  Delta_p:
    description: signed processing-minus-Truth profile-frame ray-parameter mismatch
    unit: s/m
  K:
    description: zero-tilt sensitivity of Delta_p with respect to tau
    unit: s/m/rad

validity_domain:
  - one principal plane
  - configured steering angle strictly inside -pi/2 to pi/2
  - positive c_true and c_used
  - propagating Truth steering state with abs((c_true/c_used) * sin(theta)) < 1
  - same reduced reciprocal array-tilt model documented by the related symmetry-break experiment

analytical_properties:
  zero_bias: "K(theta, 0) = 0"
  beam_sign_symmetry: "K(-theta, b) = K(theta, b)"
  exact_tilt_reconstruction: "Delta_p(tau) = K * sin(tau)"
  interpretation: >-
    K measures initial profile-frame ray-parameter sensitivity. It is not a direct
    sounding-error or uncertainty metric.

assumptions:
  - c_used differs from c_true only by the explicit additive sensor bias b
  - TX steering and RX angle mapping follow the existing controlled array-frame semantics
  - platform attitude and multi-sector geometry are outside this analytical map

known_limitations:
  - final sounding error is not determined by K alone
  - larger absolute K must not be interpreted as an operational accuracy statement
  - behavior near propagation limits must be evaluated from the exact formula rather than extrapolated from moderate-angle tests
  - no independent TX/RX array rotations or full 3-D Mills-cross geometry are represented

hydrosim_derivation:
  evidence_level: analytical_derivation_from_registered_model
  statement: >-
    Expanding the exact Truth and processing profile-frame ray parameters from the
    principal-plane array-tilt symmetry-break model cancels the cos(tau) term and
    leaves Delta_p(tau) = K sin(tau). The map evaluates K directly and does not use
    the layered ray tracer.

implementation:
  modules:
    - src/hydrosim/acquisition/principal_plane_array_tilt_sensitivity_map.py
  symbols:
    - PrincipalPlaneArrayTiltSensitivityMapPoint
    - PrincipalPlaneArrayTiltSensitivityMap
    - principal_plane_array_tilt_sensitivity_coefficient
    - run_principal_plane_array_tilt_sensitivity_map

validation:
  tests:
    - tests/test_principal_plane_array_tilt_sensitivity_map.py::test_sensitivity_coefficient_matches_independent_closed_form
    - tests/test_principal_plane_array_tilt_sensitivity_map.py::test_zero_bias_has_zero_tilt_sensitivity_for_all_tested_beam_angles
    - tests/test_principal_plane_array_tilt_sensitivity_map.py::test_sensitivity_is_even_in_beam_angle_for_fixed_bias
    - tests/test_principal_plane_array_tilt_sensitivity_map.py::test_bias_sign_reverses_sensitivity_sign_in_controlled_case
    - tests/test_principal_plane_array_tilt_sensitivity_map.py::test_map_order_is_angle_outer_bias_inner_and_outer_beams_are_more_sensitive_here
    - tests/test_principal_plane_array_tilt_sensitivity_map.py::test_map_rejects_empty_axes_and_non_propagating_states
  independent_anchor: >-
    The primary test recomputes theta_phys and K directly from elementary
    trigonometric expressions outside the implementation function. Limiting and
    symmetry tests separately exercise zero bias, beam-sign symmetry, bias sign,
    ordering, and the propagation boundary.

related_models:
  - hydrosim.integration.principal_plane_array_tilt_symmetry_break
  - hydrosim.integration.principal_plane_array_tilt_sensitivity
  - hydrosim.propagation.sound_speed_zero_thickness_boundary

explanatory_documentation:
  - docs/science/principal_plane_array_tilt_sensitivity_map.md
  - docs/science/principal_plane_array_tilt_sensitivity.md
  - docs/science/principal_plane_array_tilt.md
