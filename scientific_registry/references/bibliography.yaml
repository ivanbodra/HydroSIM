  - id: lurton_2003_acoustical_measurement_accuracy
    type: journal_article
    authors:
      - Xavier Lurton
    year: 2003
    title: "Theoretical Modelling of Acoustical Measurement Accuracy for Swath Bathymetric Sonars"
    publication: "The International Hydrographic Review"
    volume: "4"
    issue: "2"
    affiliation: "Ifremer"
    primary_url: "https://journals.lib.unb.ca/index.php/ihr/article/view/20615"
    scope:
      - acoustic sounding measurement
      - time-angle bathymetry
      - measurement accuracy
      - amplitude and phase methods
      - signal-to-noise ratio
    notes: >-
      Primary reference for intrinsic acoustic time/angle measurement accuracy.
      Kept conceptually separate from integration-error models.

  - id: beaudoin_hughes_clarke_bartlett_2004_surface_sound_speed
    type: journal_article
    authors:
      - Jonathan D. Beaudoin
      - John E. Hughes Clarke
      - Jason E. Bartlett
    year: 2004
    title: "Application of Surface Sound Speed Measurements in Post-processing for Multi-Sector Multibeam Echosounders"
    publication: "The International Hydrographic Review"
    volume: "5"
    issue: "3"
    pages: "17-32"
    primary_url: "https://journals.lib.unb.ca/index.php/ihr/article/view/20675"
    scope:
      - surface sound speed
      - multibeam steering
      - multi-sector processing
      - sector timing and association
      - refraction correction
    notes: >-
      Primary literature for the interaction between surface sound-speed information,
      beam steering and multi-sector multibeam processing. HydroSIM uses it to constrain
      the validity domain of simple aligned reference cases rather than as evidence for
      universal cancellation.

  - id: nistad_improved_water_column_sound_speed_ray_tracing
    type: journal_article
    authors:
      - J.-G. Nistad et al.
    title: "Improved Techniques to Resolve the Water Column Sound Speed Structure for Multibeam Ray Tracing"
    publication: "The International Hydrographic Review"
    primary_url: "https://ihr.iho.int/articles/improved-techniques-to-resolve-the-water-column-sound-speed-structure-for-multibeam-ray-tracing/"
    scope:
      - water-column sound speed
      - multibeam ray tracing
      - refraction
      - sound-speed structure
    notes: >-
      Hydrographic literature supporting explicit treatment of water-column sound-speed
      structure in multibeam ray tracing. Exact formula/source locators should be tightened
      as the propagation registry matures.

  - id: demer_et_al_2015_calibration_acoustic_instruments
    type: technical_report
    authors:
      - David A. Demer
      - Laurent Berger
      - Matteo Bernasconi
      - Eckhard Bethke
      - Kevin Boswell
      - Dezhang Chu
      - Reka Domokos
      - et al.
    year: 2015
    title: "Calibration of acoustic instruments"
    publication: "ICES Cooperative Research Report"
    report_number: "326"
    publisher: "International Council for the Exploration of the Sea (ICES)"
    doi: "10.17895/ices.pub.5494"
    primary_url: "https://doi.org/10.17895/ices.pub.5494"
    scope:
      - acoustic instrument calibration
      - transducer arrays
      - multibeam echosounders
      - Mills Cross geometry
      - split-beam and multibeam bearing estimation
    notes: >-
      Recognized hydroacoustic reference supporting the common Mills-Cross MBES
      description: a line-array transmit fan combined with an orthogonal receive array
      that electronically forms multiple beams. Used by HydroSIM as support for the
      generic Mills-Cross configuration, not as a vendor-specific transducer model.

  - id: kongsberg_em120_operator_manual_850_164112
    type: manufacturer_manual
    organization: "Kongsberg Maritime"
    title: "EM 120 Operator Manual"
    document_number: "850-164112"
    primary_url: "https://www.kongsberg.com/globalassets/kongsberg-maritime/km-products/product-documents/164112-em120-operator-manual.pdf"
    scope:
      - sound speed at transducer depth
      - beam pointing
      - ray bending
      - flat transducer mounting
      - real-time sound-speed measurement
    notes: >-
      Product-specific authoritative documentation. Used as supporting evidence for the
      physical plausibility of limited sound-speed-at-transducer cancellation under narrow
      flat/horizontal-array conditions, not as a universal sonar rule.

  - id: kongsberg_em1002_operator_manual_850_160977
    type: manufacturer_manual
    organization: "Kongsberg"
    title: "EM 1002 Operator Manual"
    document_number: "850-160977"
    scope:
      - sound-speed profile
      - sound speed at transducer
      - beam steering
      - first profile value
    notes: >-
      Product-specific support for workflows that use a sensor near the transducer face
      for beam steering and as the first sound-speed-profile value. HydroSIM represents
      the corresponding point value as an explicit zero-thickness boundary rather than
      overwriting a finite-thickness layer.
