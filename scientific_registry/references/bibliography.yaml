    type: conference_paper
    authors:
      - Brandon Maingot
      - John E. Hughes Clarke
      - Brian R. Calder
    year: 2019
    title: "High Frequency Motion Residuals in Multibeam Data: Identification and Estimation"
    publication: "U.S. Hydrographic Conference"
    primary_url: "https://scholars.unh.edu/ccom/1683/"
    scope:
