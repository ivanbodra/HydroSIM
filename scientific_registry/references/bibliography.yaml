  - id: lurton_2003_acoustical_measurement_accuracy
    type: journal_article
    authors:
      - Xavier Lurton
    year: 2003
    title: "Theoretical Modelling of Acoustical Measurement Accuracy for Swath Bathymetric Sonars"
    publication: "The International Hydrographic Review"
    volume: "4"
    issue: "2"
    affiliation: "Ifremer"
    primary_url: "https://journals.lib.unb.ca/index.php/ihr/article/view/20615"
    scope:
