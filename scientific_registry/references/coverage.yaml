version: 0.1.1
language: en
purpose: >-
  Canonical map from HydroSIM scientific domains and explanatory contracts to stable
  bibliography IDs. A contract may inherit references through an explicitly named
  canonical dependency when its equations are purely derived geometry or state semantics.

rules:
  - External scientific or standards claims must map to at least one bibliography ID.
  - Manufacturer-specific behavior must map to the exact named manual/product reference.
  - Pure mathematical identities may be marked mathematical_identity and need no external citation.
  - HydroSIM-specific conventions/state semantics may be marked internal_contract when they are definitions, not external scientific claims.
  - Derived pedagogical rules must identify the source model and use evidence_level derived_from_source.
  - New references used by authoritative contracts must be added to bibliography.yaml before the contract is considered traceability-complete.

