name: pedagogical-frontend

on:
  push:
    paths:
      - 'web/pedagogical-explorer/**'
      - 'src/hydrosim/app/**'
      - 'src/hydrosim/acquisition/**'
      - 'src/hydrosim/visualization/**'
      - '.github/workflows/pedagogical-frontend.yml'
  pull_request:
    paths:
      - 'web/pedagogical-explorer/**'
      - 'src/hydrosim/app/**'
      - 'src/hydrosim/acquisition/**'
      - 'src/hydrosim/visualization/**'
      - '.github/workflows/pedagogical-frontend.yml'
  workflow_dispatch:

jobs:
  production-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/pedagogical-explorer
    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve production lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci

      - name: Install HydroSIM web bridge
        working-directory: ${{ github.workspace }}
        run: python -m pip install -e '.[web]'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production frontend
        run: npm run build

      - name: Start built frontend
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/hydrosim-pedagogical-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hydrosim-pedagogical-preview.log
          exit 1

      - name: Run focused learner UI tests
        id: focused_ui
        continue-on-error: true
        run: npm run test:ui

      - name: Start real pedagogical API
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          python -m uvicorn hydrosim.app.signal_api:app --host 127.0.0.1 --port 8000 > /tmp/hydrosim-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hydrosim-api.log
          exit 1

      - name: Start production frontend on API-authorized origin
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/hydrosim-pedagogical-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hydrosim-pedagogical-dev.log
          exit 1

      - name: Run D1-D4 real React-Python smoke
        id: runtime_d1_d4
        continue-on-error: true
        env: &real_api_env
          HYDROSIM_E2E_REAL_API: '1'
          HYDROSIM_UI_BASE_URL: http://127.0.0.1:5173
        run: npx playwright test ui-tests/ped-d1-d2-real-api.spec.ts ui-tests/ped-d3-d4-real-api.spec.ts

      - name: Run D7 real React-Python smoke
        id: runtime_d7
        continue-on-error: true
        env: *real_api_env
        run: npx playwright test ui-tests/ped-d7-real-api.spec.ts

      - name: Run D8 real React-Python smoke
        id: runtime_d8
        continue-on-error: true
        env: *real_api_env
        run: npx playwright test ui-tests/ped-d8-real-api.spec.ts

      - name: Run D9 real React-Python smoke
        id: runtime_d9
        continue-on-error: true
        env: *real_api_env
        run: npx playwright test ui-tests/ped-d9-real-api.spec.ts

      - name: Run D12 real React-Python smoke
        id: runtime_d12
        continue-on-error: true
        env: *real_api_env
        run: npx playwright test ui-tests/ped-d12-real-api.spec.ts

      - name: Run D13 real React-Python smoke
        id: runtime_d13
        continue-on-error: true
        env: *real_api_env
        run: npx playwright test ui-tests/ped-d13-real-api.spec.ts

      - name: Enforce learner and integration gates
        if: always()
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FOCUSED_UI: ${{ steps.focused_ui.outcome }}
          D1_D4: ${{ steps.runtime_d1_d4.outcome }}
          D7: ${{ steps.runtime_d7.outcome }}
          D8: ${{ steps.runtime_d8.outcome }}
          D9: ${{ steps.runtime_d9.outcome }}
          D12: ${{ steps.runtime_d12.outcome }}
          D13: ${{ steps.runtime_d13.outcome }}
        run: |
          printf '%-24s %s\n' \
            'focused learner UI' "$FOCUSED_UI" \
            'D1-D4 React-Python' "$D1_D4" \
            'D7 React-Python' "$D7" \
            'D8 React-Python' "$D8" \
            'D9 React-Python' "$D9" \
            'D12 React-Python' "$D12" \
            'D13 React-Python' "$D13"
          test "$FOCUSED_UI" = success
          test "$D1_D4" = success
          test "$D7" = success
          test "$D8" = success
          test "$D9" = success
          test "$D12" = success
          test "$D13" = success
