name: pedagogical-frontend

on:
  push:
    paths:
      - 'web/pedagogical-explorer/**'
      - 'src/hydrosim/app/**'
      - 'src/hydrosim/acquisition/**'
      - 'src/hydrosim/visualization/**'
      - '.github/workflows/pedagogical-frontend.yml'
  pull_request:
    paths:
      - 'web/pedagogical-explorer/**'
      - 'src/hydrosim/app/**'
      - 'src/hydrosim/acquisition/**'
      - 'src/hydrosim/visualization/**'
      - '.github/workflows/pedagogical-frontend.yml'
  workflow_dispatch:

jobs:
  production-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/pedagogical-explorer
    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve production lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci

      - name: Install HydroSIM web bridge
        working-directory: ${{ github.workspace }}
        run: python -m pip install -e '.[web]'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production frontend
        run: npm run build

      - name: Start built frontend
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/hydrosim-pedagogical-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hydrosim-pedagogical-preview.log
          exit 1

      - name: Run focused learner UI tests
        run: npm run test:ui

      - name: Start real pedagogical API
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          python -m uvicorn hydrosim.app.signal_api:app --host 127.0.0.1 --port 8000 > /tmp/hydrosim-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hydrosim-api.log
          exit 1

      - name: Start production frontend on API-authorized origin
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/hydrosim-pedagogical-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hydrosim-pedagogical-dev.log
          exit 1

      - name: Run PED-D2 real React-Python smoke
        env:
          HYDROSIM_E2E_REAL_API: '1'
          HYDROSIM_UI_BASE_URL: http://127.0.0.1:5173
        run: npx playwright test ui-tests/ped-d2-real-api.spec.ts
