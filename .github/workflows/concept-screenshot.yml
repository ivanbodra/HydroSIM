name: concept-screenshot

on:
  push:
    paths:
      - 'concepts/pedagogical-simulator/**'
      - '.github/workflows/concept-screenshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-concept:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: concepts/pedagogical-simulator
    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build concept prototype
        run: npm run build

      - name: Start built prototype
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/hydrosim-concept-vite.log 2>&1 &
          echo $! > /tmp/hydrosim-concept-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hydrosim-concept-vite.log
          exit 1

      - name: Capture real concept laboratories
        run: npm run capture

      - name: Verify screenshots
        shell: bash
        run: |
          files=(
            signal-waveform-lab.png
            beam-directivity-lab.png
            propagation-water-column-lab.png
            vessel-sensors-lab.png
            motion-platform-lab.png
            integrated-survey-lab.png
          )
          for image in "${files[@]}"; do
            test -s "assets/screenshots/$image"
            file "assets/screenshots/$image"
          done

      - name: Upload concept screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: pedagogical-concept-screenshots
          path: concepts/pedagogical-simulator/assets/screenshots/*.png

      - name: Persist screenshots on tested branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/*.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update real pedagogical prototype screenshots [skip ci]"
          git push origin HEAD:${TARGET_BRANCH}
