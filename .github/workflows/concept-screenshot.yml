name: concept-screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-concept:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: concepts/pedagogical-simulator
    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install frontend dependencies
        run: npm ci

      - name: Install HydroSIM web bridge
        working-directory: ${{ github.workspace }}
        run: python -m pip install -e '.[web]'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build concept prototype
        run: npm run build

      - name: Start built prototype
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/hydrosim-concept-vite.log 2>&1 &
          echo $! > /tmp/hydrosim-concept-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hydrosim-concept-vite.log
          exit 1

      - name: Run focused learner UI tests
        run: npm run test:ui

      - name: Start real pedagogical API
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          python -m uvicorn hydrosim.app.signal_api:app --host 127.0.0.1 --port 8000 > /tmp/hydrosim-api.log 2>&1 &
          echo $! > /tmp/hydrosim-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hydrosim-api.log
          exit 1

      - name: Start learner frontend on API-authorized origin
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/hydrosim-concept-dev.log 2>&1 &
          echo $! > /tmp/hydrosim-concept-dev.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hydrosim-concept-dev.log
          exit 1

      - name: Run targeted PED-D2 real API end-to-end smoke
        env:
          HYDROSIM_E2E_REAL_API: '1'
          HYDROSIM_UI_BASE_URL: http://127.0.0.1:5173
        run: npx playwright test ui-tests/ped-d2-real-api.spec.ts

      - name: Capture real concept laboratories
        run: npm run capture

      - name: Verify screenshots
        shell: bash
        run: |
          files=(
            system-map.png
            signal-waveform-lab.png
            beam-directivity-lab.png
            propagation-water-column-lab.png
            vessel-sensors-lab.png
            motion-platform-lab.png
            integrated-survey-lab.png
          )
          for image in "${files[@]}"; do
            test -s "assets/screenshots/$image"
            file "assets/screenshots/$image"
          done

      - name: Upload concept screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: pedagogical-concept-screenshots
          path: concepts/pedagogical-simulator/assets/screenshots/*.png
