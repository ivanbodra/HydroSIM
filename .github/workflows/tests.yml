name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,visualization]'

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q

      - name: Capture legacy Didactic Explorer lessons on explicit request
        if: github.event_name == 'workflow_dispatch'
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: QtAgg
        shell: bash
        run: |
          mkdir -p docs/images artifacts
          set +e
          python tools/capture_didactic_explorer.py --output docs/images/didactic_explorer_actual.png > artifacts/capture.log 2>&1
          actual_status=$?
          python tools/capture_didactic_explorer.py --lesson Signal --output docs/images/didactic_explorer_signal.png >> artifacts/capture.log 2>&1
          signal_status=$?
          python tools/capture_didactic_explorer.py --lesson Beam --output docs/images/didactic_explorer_beam.png >> artifacts/capture.log 2>&1
          beam_status=$?
          python tools/capture_didactic_explorer.py --lesson "Sonar Equation" --output docs/images/didactic_explorer_sonar_equation.png >> artifacts/capture.log 2>&1
          sonar_equation_status=$?
          python tools/capture_didactic_explorer.py --lesson Propagation --output docs/images/didactic_explorer_propagation.png >> artifacts/capture.log 2>&1
          propagation_status=$?
          python tools/capture_didactic_explorer.py --lesson Vessel --output docs/images/didactic_explorer_vessel.png >> artifacts/capture.log 2>&1
          vessel_status=$?
          python tools/capture_didactic_explorer.py --lesson Motion --output docs/images/didactic_explorer_motion.png >> artifacts/capture.log 2>&1
          motion_status=$?
          python tools/capture_didactic_explorer.py --lesson "Sonar Systems" --output docs/images/didactic_explorer_sonar_systems.png >> artifacts/capture.log 2>&1
          sonar_systems_status=$?
          python tools/capture_didactic_explorer.py --lesson "Sounding Formation" --output docs/images/didactic_explorer_sounding_formation.png >> artifacts/capture.log 2>&1
          sounding_formation_status=$?
          set -e

          test "$actual_status" = "0"
          test "$signal_status" = "0"
          test "$beam_status" = "0"
          test "$sonar_equation_status" = "0"
          test "$propagation_status" = "0"
          test "$vessel_status" = "0"
          test "$motion_status" = "0"
          test "$sonar_systems_status" = "0"
          test "$sounding_formation_status" = "0"
          test -s docs/images/didactic_explorer_actual.png
          test -s docs/images/didactic_explorer_signal.png
          test -s docs/images/didactic_explorer_beam.png
          test -s docs/images/didactic_explorer_sonar_equation.png
          test -s docs/images/didactic_explorer_propagation.png
          test -s docs/images/didactic_explorer_vessel.png
          test -s docs/images/didactic_explorer_motion.png
          test -s docs/images/didactic_explorer_sonar_systems.png
          test -s docs/images/didactic_explorer_sounding_formation.png

      - name: Upload legacy screenshots and diagnostics
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: didactic-explorer-screenshot
          path: |
            docs/images/didactic_explorer_*.png
            artifacts/

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: concepts/pedagogical-simulator
    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: concepts/pedagogical-simulator/package-lock.json

      - name: Install from committed lockfile
        run: npm ci

      - name: Build pedagogical frontend
        run: npm run build
