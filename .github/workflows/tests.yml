name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,visualization]'

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q

      - name: Capture real Didactic Explorer window
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: QtAgg
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python tools/capture_didactic_explorer.py --output artifacts/didactic_explorer_actual.png > artifacts/capture.log 2>&1
          echo $? > artifacts/capture.exit
          exit 0

      - name: Upload Didactic Explorer screenshot and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: didactic-explorer-screenshot
          path: artifacts/

      - name: Publish real screenshot to repository
        if: github.ref == 'refs/heads/ui-shot'
        shell: bash
        run: |
          test "$(cat artifacts/capture.exit)" = "0"
          mkdir -p docs/images
          cp artifacts/didactic_explorer_actual.png docs/images/didactic_explorer_actual.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/didactic_explorer_actual.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add real Didactic Explorer screenshot [skip ci]"
          git push origin HEAD:ui-shot
