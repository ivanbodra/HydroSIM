name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,visualization]'

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q

      - name: Capture real Didactic Explorer window
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: QtAgg
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python tools/capture_didactic_explorer.py --output artifacts/didactic_explorer_actual.png > artifacts/capture.log 2>&1
          echo $? > artifacts/capture.exit
          exit 0

      - name: Upload Didactic Explorer screenshot and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: didactic-explorer-screenshot
          path: artifacts/
