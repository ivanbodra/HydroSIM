name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pytest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect legacy visual regression scope
        id: legacy_visual
        shell: bash
        run: |
          set -euo pipefail
          run_capture=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            run_capture=true
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
            if grep -Eq '^(src/hydrosim/(app|visualization)/|tools/capture_didactic_explorer\.py|tests/test_.*(didactic|renderer|visual|beam|motion|vessel|sonar|propagation))' <<<"$changed_files"; then
              run_capture=true
            fi
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            if grep -Eq '^(src/hydrosim/(app|visualization)/|tools/capture_didactic_explorer\.py|tests/test_.*(didactic|renderer|visual|beam|motion|vessel|sonar|propagation))' <<<"$changed_files"; then
              run_capture=true
            fi
          fi

          echo "run_capture=$run_capture" >> "$GITHUB_OUTPUT"
          echo "Legacy visual capture required: $run_capture"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,visualization]'

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q

      - name: Capture real Didactic Explorer lessons
        if: steps.legacy_visual.outputs.run_capture == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: QtAgg
        shell: bash
        run: |
          mkdir -p docs/images artifacts
          set +e
          python tools/capture_didactic_explorer.py --output docs/images/didactic_explorer_actual.png > artifacts/capture.log 2>&1
          actual_status=$?
          python tools/capture_didactic_explorer.py --lesson Signal --output docs/images/didactic_explorer_signal.png >> artifacts/capture.log 2>&1
          signal_status=$?
          python tools/capture_didactic_explorer.py --lesson Beam --output docs/images/didactic_explorer_beam.png >> artifacts/capture.log 2>&1
          beam_status=$?
          python tools/capture_didactic_explorer.py --lesson "Sonar Equation" --output docs/images/didactic_explorer_sonar_equation.png >> artifacts/capture.log 2>&1
          sonar_equation_status=$?
          python tools/capture_didactic_explorer.py --lesson Propagation --output docs/images/didactic_explorer_propagation.png >> artifacts/capture.log 2>&1
          propagation_status=$?
          python tools/capture_didactic_explorer.py --lesson Vessel --output docs/images/didactic_explorer_vessel.png >> artifacts/capture.log 2>&1
          vessel_status=$?
          python tools/capture_didactic_explorer.py --lesson Motion --output docs/images/didactic_explorer_motion.png >> artifacts/capture.log 2>&1
          motion_status=$?
          python tools/capture_didactic_explorer.py --lesson "Sonar Systems" --output docs/images/didactic_explorer_sonar_systems.png >> artifacts/capture.log 2>&1
          sonar_systems_status=$?
          python tools/capture_didactic_explorer.py --lesson "Sounding Formation" --output docs/images/didactic_explorer_sounding_formation.png >> artifacts/capture.log 2>&1
          sounding_formation_status=$?
          set -e

          printf '%s\n' "$actual_status" > artifacts/capture.exit
          printf '%s\n' "$signal_status" > artifacts/capture_signal.exit
          printf '%s\n' "$beam_status" > artifacts/capture_beam.exit
          printf '%s\n' "$sonar_equation_status" > artifacts/capture_sonar_equation.exit
          printf '%s\n' "$propagation_status" > artifacts/capture_propagation.exit
          printf '%s\n' "$vessel_status" > artifacts/capture_vessel.exit
          printf '%s\n' "$motion_status" > artifacts/capture_motion.exit
          printf '%s\n' "$sonar_systems_status" > artifacts/capture_sonar_systems.exit
          printf '%s\n' "$sounding_formation_status" > artifacts/capture_sounding_formation.exit

          test "$actual_status" = "0"
          test "$signal_status" = "0"
          test "$beam_status" = "0"
          test "$sonar_equation_status" = "0"
          test "$propagation_status" = "0"
          test "$vessel_status" = "0"
          test "$motion_status" = "0"
          test "$sonar_systems_status" = "0"
          test "$sounding_formation_status" = "0"
          test -s docs/images/didactic_explorer_actual.png
          test -s docs/images/didactic_explorer_signal.png
          test -s docs/images/didactic_explorer_beam.png
          test -s docs/images/didactic_explorer_sonar_equation.png
          test -s docs/images/didactic_explorer_propagation.png
          test -s docs/images/didactic_explorer_vessel.png
          test -s docs/images/didactic_explorer_motion.png
          test -s docs/images/didactic_explorer_sonar_systems.png
          test -s docs/images/didactic_explorer_sounding_formation.png

      - name: Upload Didactic Explorer screenshots and diagnostics
        if: always() && steps.legacy_visual.outputs.run_capture == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: didactic-explorer-screenshot
          path: |
            docs/images/didactic_explorer_*.png
            artifacts/

      - name: Persist real screenshots on the tested branch
        if: github.event_name == 'push' && steps.legacy_visual.outputs.run_capture == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          test "$(cat artifacts/capture.exit)" = "0"
          test "$(cat artifacts/capture_signal.exit)" = "0"
          test "$(cat artifacts/capture_beam.exit)" = "0"
          test "$(cat artifacts/capture_sonar_equation.exit)" = "0"
          test "$(cat artifacts/capture_propagation.exit)" = "0"
          test "$(cat artifacts/capture_vessel.exit)" = "0"
          test "$(cat artifacts/capture_motion.exit)" = "0"
          test "$(cat artifacts/capture_sonar_systems.exit)" = "0"
          test "$(cat artifacts/capture_sounding_formation.exit)" = "0"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/didactic_explorer_*.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update real Didactic Explorer screenshots [skip ci]"
          git push origin HEAD:${TARGET_BRANCH}

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: concepts/pedagogical-simulator
    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve lockfile from pinned dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from lockfile
        run: npm ci

      - name: Build pedagogical frontend
        run: npm run build

      - name: Persist generated lockfile on pushed engineering branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        working-directory: .
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git add concepts/pedagogical-simulator/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock pedagogical frontend dependencies [skip ci]"
          git push origin HEAD:${TARGET_BRANCH}
